<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Legend Stats</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 14px system-ui, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    #status a { color: #8cf; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <iframe id="view" title="Legend Stats" hidden></iframe>

  <script>
    const TARGET = "https://legendstats.pages.dev/";

    // Tried in order: direct fetch first, then public CORS proxies.
    const ROUTES = [
      u => u,
      u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
      u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    ];

    async function fetchHtml() {
      for (const route of ROUTES) {
        try {
          const res = await fetch(route(TARGET));
          if (!res.ok) continue;
          const text = await res.text();
          if (text.trim()) return text;
        } catch (e) { /* try next route */ }
      }
      throw new Error("All routes failed");
    }

    (async () => {
      const status = document.getElementById("status");
      const view = document.getElementById("view");
      try {
        let html = await fetchHtml();
        // Make relative URLs (CSS, JS, images, links) resolve against the real site
        const base = '<base href="' + TARGET + '">';
        html = /<head[^>]*>/i.test(html)
          ? html.replace(/<head[^>]*>/i, m => m + base)
          : base + html;
        view.srcdoc = html;
        view.hidden = false;
        status.remove();
      } catch (e) {
        status.innerHTML = 'Couldn’t fetch the page. <a href="' + TARGET + '">Open it directly</a>.';
      }
    })();
  </script>
</body>
</html>
